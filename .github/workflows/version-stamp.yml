name: Stamp version.json
on:
  push:
    branches: [ main ]
permissions:
  contents: write
# Prevent overlapping runs racing on the same commit
concurrency:
  group: version-stamp
  cancel-in-progress: false
jobs:
  stamp:
    runs-on: ubuntu-latest
    # Skip when the push was the bot's own stamp commit (avoids loops).
    # Uses [bot-stamp] - NOT [skip ci] - so Cloudflare Pages still deploys.
    if: ${{ !contains(github.event.head_commit.message, '[bot-stamp]') }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0
      - name: Write version.json
        run: |
          SHA=$(git rev-parse --short HEAD)
          DATE=$(date -u +%Y%m%d-%H%M)
          echo "{\"v\":\"${DATE}-${SHA}\"}" > frontend/version.json
          echo "Stamped: ${DATE}-${SHA}"
      - name: Commit & push
        run: |
          git config user.name "APlusZ Bot"
          git config user.email "bot@aplusz.app"
          git add frontend/version.json
          if git diff --staged --quiet; then
            echo "No version change"
            exit 0
          fi
          git commit -m "version stamp [bot-stamp]"
          # A human push landing between checkout and push makes this
          # non-fast-forward. Rebase onto whatever is there now and retry.
          for i in 1 2 3 4 5; do
            if git push; then
              echo "pushed on attempt $i"
              exit 0
            fi
            echo "push rejected, rebasing (attempt $i)"
            git pull --rebase origin main || exit 1
            sleep 3
          done
          echo "::error::could not push version stamp after 5 attempts"
          exit 1